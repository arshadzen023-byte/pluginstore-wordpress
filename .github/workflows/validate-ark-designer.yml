name: Validate ARK App Designer
on:
  pull_request:
    paths:
      - 'wp-content/plugins/ark-app-designer/**'
      - 'wp-content/plugins/ark-woo-product-promo-slider/**'
      - 'wp-content/plugins/ark-native-api-bridge/**'
      - 'wp-content/plugins/ark-native-app-builder/**'
      - '.github/workflows/validate-ark-designer.yml'
  push:
    branches: [main]
    paths:
      - 'wp-content/plugins/ark-app-designer/**'
      - 'wp-content/plugins/ark-native-app-builder/**'
      - '.github/workflows/validate-ark-designer.yml'
permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate PHP syntax
        run: php -l wp-content/plugins/ark-app-designer/ark-app-designer.php
      - name: Validate ARK Native App Builder PHP syntax
        run: php -l wp-content/plugins/ark-native-app-builder/ark-native-app-builder.php && php -l wp-content/plugins/ark-native-app-builder/includes/class-ark-nab.php
      - name: Validate Native API Bridge PHP syntax
        run: php -l wp-content/plugins/ark-native-api-bridge/ark-native-api-bridge.php
      - name: Validate Designer JavaScript syntax
        run: node --check wp-content/plugins/ark-app-designer/assets/admin.js
      - name: Run Designer persistence regression checks
        run: php wp-content/plugins/ark-app-designer/tests/designer-smoke-test.php
      - name: Validate Promo Slider PHP syntax
        run: php -l wp-content/plugins/ark-woo-product-promo-slider/ark-woo-product-promo-slider.php
      - name: Package updated WordPress plugins
        run: |
          mkdir -p dist
          cd wp-content/plugins
          zip -r ../../dist/ark-app-designer-1.17.4.zip ark-app-designer
          zip -r ../../dist/ark-native-app-builder-0.2.0.zip ark-native-app-builder
          zip -r ../../dist/ark-woo-product-promo-slider-1.1.2.zip ark-woo-product-promo-slider
      - name: Publish installable ZIP downloads
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/ark-plugin-downloads
          cp dist/ark-app-designer-1.17.4.zip /tmp/ark-plugin-downloads/
          cp dist/ark-native-app-builder-0.2.0.zip /tmp/ark-plugin-downloads/
          cp dist/ark-woo-product-promo-slider-1.1.2.zip /tmp/ark-plugin-downloads/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin plugin-downloads >/dev/null 2>&1; then
            git fetch origin plugin-downloads
            git checkout -B plugin-downloads FETCH_HEAD
          else
            git checkout --orphan plugin-downloads
          fi
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/ark-plugin-downloads/*.zip .
          git add ark-app-designer-1.9.0.zip ark-native-app-builder-0.2.0.zip ark-woo-product-promo-slider-1.1.2.zip
          git commit -m "Publish installable WordPress plugin ZIPs"
          git push https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git HEAD:plugin-downloads --force

      - name: Save updated plugin ZIPs
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ark-native-wordpress-plugins-1.17.4
          path: |
            dist/ark-app-designer-1.9.0.zip
            dist/ark-native-app-builder-0.2.0.zip
            dist/ark-woo-product-promo-slider-1.1.2.zip
          retention-days: 30
